# Deploy automático: a cada push na main → instala, testa (se falhar, não publica), compila e publica no GitHub Pages.
# Uma vez só no GitHub: Settings › Pages › Source: GitHub Actions.
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar-e-compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # cache da checagem de tipos (tsc -b): depois do npm ci (que apaga o node_modules). Seguro mesmo velho: o tsc
      # compara o conteúdo de cada arquivo e verifica de novo tudo o que mudou e o que depende dele.
      - name: Cache da checagem de tipos
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - name: Testes (regras, contrato local × API, telas)
        run: npm test
      - name: Tipos + build de produção
        run: npm run build
      - name: Conferir se o GitHub Pages está ligado
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$codigo" = "404" ]; then
            echo "::error title=GitHub Pages desligado::Ligue uma vez: Settings › Pages › Build and deployment › Source: GitHub Actions. Depois rode este workflow de novo (Actions › Testar e publicar › Re-run)."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request'
    needs: testar-e-compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
