# Contrato da API (rascunho gerado a partir de src/core/services/index.ts).
# O app já fala este contrato pelo adaptador src/adapters/api/backendApi.ts (canal cifrado: canalSeguro.ts) e é
# testado contra uma API simulada (src/adapters/api/apiSimulada.ts), que também faz o lado do servidor do envelope.
# O servidor de verdade só precisa responder igual. Protocolo do envelope: src/core/seguranca/envelope.ts.
openapi: 3.1.0
info:
  title: Tudo · API
  version: 2.0.0
  description: |
    TODO o tráfego passa por um ENVELOPE CIFRADO: na rede (e na aba Rede do navegador) não aparece nome de comando,
    parâmetro, token, valor nem mensagem de erro. Só existem dois endereços, ambos POST com corpo binário
    (application/octet-stream), sem query string, sem cookie e sem cabeçalho Authorization.

    1) Aperto de mão — POST /v1/k
       pedido   : chavePublicaApp(65) ‖ nonceApp(16)
       resposta : chavePublicaServ(65) ‖ nonceServ(16) ‖ sessao(16) ‖ [assinatura(64)]
       - chaves públicas: ECDH P-256 efêmeras, formato "raw" (não comprimido, 65 bytes).
       - assinatura: ECDSA P-256 / SHA-256 (formato IEEE P1363, r‖s) com a chave FIXA do servidor sobre
         "tudo/v1/k" ‖ chavePublicaApp ‖ nonceApp ‖ chavePublicaServ ‖ nonceServ ‖ sessao.
         Se o app foi gerado com VITE_API_CHAVE_PUBLICA (chave pública fixa em base64), a assinatura é obrigatória
         e conferida: sem ela, ou inválida, o app não conversa (proteção contra alguém no meio).
       - chaves de sessão: segredo ECDH (256 bits) → HKDF-SHA-256, sal = nonceApp ‖ nonceServ,
         info "tudo/v1/app→serv" (chave de ida) e "tudo/v1/serv→app" (chave de volta) → AES-GCM-256.

    2) Pedido — POST /v1/r
       pedido   : sessao(16) ‖ iv(12) ‖ AES-GCM(ida, texto)      AAD = "tudo/v1/app→serv" ‖ sessao
       resposta : iv(12) ‖ AES-GCM(volta, texto)                 AAD = "tudo/v1/serv→app" ‖ sessao
       - IV aleatório de 96 bits a cada mensagem; etiqueta de 128 bits.
       - texto = comprimento (uint32 big-endian) ‖ JSON UTF-8 ‖ zeros até múltiplo de 1024 bytes (o tamanho vaza menos).
       - JSON do pedido = Mensagem; JSON da resposta = Resposta (ver components.schemas).

    Repetição: o servidor guarda os ids vistos por sessão (por 2 × janela) e recusa id repetido (400 sem corpo);
    ts fora de ±5 min → Resposta { ok: false, falha: "relogio", ts } e NADA é executado (o app ajusta o relógio
    pelo ts do servidor e manda uma mensagem nova). Idempotência de comandos: campo "chave" (nome:id da operação).

    Erros: erro de regra = HTTP 200 com { ok: false, erro: { mensagem, campo } } DENTRO do envelope.
    Falha de transporte = status sem corpo e sem detalhe: 400 (envelope inválido, alterado ou repetido),
    401 (sessão desconhecida ou vencida → o app refaz o aperto de mão), 404, 500.

    Dentro do envelope os corpos são os mesmos tipos do app (src/core/domain/tipos.ts e as assinaturas em
    src/core/services/*). Dinheiro sempre inteiro na menor unidade da moeda; datas "AAAA-MM-DD"; instantes ISO 8601 UTC;
    ids ULID gerados no aparelho.

    Recomendado no servidor de verdade: TLS (HTTPS) sempre; cabeçalhos Cache-Control: no-store,
    Referrer-Policy: no-referrer e Content-Security-Policy com frame-ancestors 'none'; CORS só para a origem do app;
    e as PERMISSÕES conferidas no servidor pelo token (o envelope esconde o conteúdo, não substitui a autorização).
servers:
  - url: https://api.exemplo.com
security: []
paths:
  /v1/k:
    post:
      summary: Aperto de mão (ECDH P-256 efêmero, opcionalmente assinado pela chave fixa do servidor)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, description: 'chavePublicaApp(65) ‖ nonceApp(16) = 81 bytes' }
      responses:
        '200':
          description: 'chavePublicaServ(65) ‖ nonceServ(16) ‖ sessao(16) ‖ [assinatura(64)] = 97 ou 161 bytes'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: Corpo inválido (resposta sem corpo) }
  /v1/r:
    post:
      summary: Único endereço de pedidos (comandos, consultas, login, backup e arquivos), sempre cifrado
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 'sessao(16) ‖ iv(12) ‖ AES-GCM(Mensagem preenchida até múltiplo de 1 KB)'
      responses:
        '200':
          description: 'iv(12) ‖ AES-GCM(Resposta preenchida até múltiplo de 1 KB). Erros de regra também vêm aqui.'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: 'Envelope alterado, chave errada ou id repetido (sem corpo)' }
        '401': { description: 'Sessão desconhecida ou vencida: refazer o aperto de mão (sem corpo)' }
        '500': { description: 'Erro interno (sem corpo, sem detalhe)' }
components:
  schemas:
    Mensagem:
      description: JSON dentro do envelope de ida
      type: object
      required: [tipo, nome, dados, id, ts]
      properties:
        tipo: { type: string, enum: [comando, consulta, auth, backup, arquivo] }
        nome:
          type: string
          description: |
            comando → NomeComando; consulta → NomeConsulta; auth → "entrar" ({ login, senha } → { token, sessao });
            backup → "exportar" | "importar"; arquivo → "enviar" ({ id, nome, mime, conteudo em base64 })
            | "baixar" ({ id } → { mime, conteudo } ou null)
        dados: { description: 'DadosComando<nome>, ParamsConsulta<nome>, { login, senha }, Backup ou arquivo' }
        id: { type: string, description: '128 bits aleatórios em base64; único (proteção contra repetição)' }
        ts: { type: integer, description: 'instante do app em ms, corrigido pelo relógio do servidor' }
        token: { type: string, description: 'token do login: só aqui dentro (nunca em cabeçalho, cookie ou endereço)' }
        chave: { type: string, description: 'idempotência "nome:id": repetir devolve o mesmo resultado (toque duplo não duplica)' }
    Resposta:
      description: JSON dentro do envelope de volta
      type: object
      required: [re, ok, ts]
      properties:
        re: { type: string, description: 'id da Mensagem respondida (o app confere)' }
        ok: { type: boolean }
        r: { description: 'resultado: ResultadoComando, ResultadoConsulta, { token, sessao }, Backup…' }
        erro: { $ref: '#/components/schemas/Erro' }
        falha: { type: string, enum: [relogio], description: 'ts fora da janela: nada executado; ajustar o relógio e mandar de novo' }
        ts: { type: integer, description: 'relógio do servidor (ms)' }
    Erro:
      type: object
      properties:
        mensagem: { type: string, description: mensagem amigável para mostrar como está }
        campo: { type: string }
    NomeComando:
