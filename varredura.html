<!doctype html>
<!--
  VARREDURA DE RESPONSIVIDADE (só no desenvolvimento: npm run dev → http://localhost:5174/varredura.html)
  Abre cada tela do sistema num quadro e passa por TODAS as larguras padrão (docs/architecture/DESENHO.md §11.7), procurando:
    · SAI DA TELA   — algo mais largo que o espaço que tem (empurra para o lado / fica cortado)
    · PALAVRA QUEBRADA — uma palavra partida no meio ("Toda / s as viage / ns"): faltou espaço, a peça precisa mudar
  Só abre e lê as telas (nunca toca em botão de salvar). Usa a sessão já entrada neste navegador.
  ?larguras=240,360 escolhe as larguras · ?rotas=viagens/novo,estoque escolhe as telas · o resultado fica em window.__resultado
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Varredura de responsividade</title>
<style>
  :root { --fundo: #f7f6fb; --texto: #1f1b2e; --suave: #6b6780; --borda: #e4e1ee; --bom: #15803d; --ruim: #dc2626; --marca: #7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #15131d; --texto: #ece9f5; --suave: #a19cb5; --borda: #2f2c3d; --bom: #4ade80; --ruim: #f87171; --marca: #a78bfa; } }
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; background: var(--fundo); color: var(--texto); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--suave); }
  #quadro { position: fixed; right: 16px; bottom: 16px; height: 700px; border: 2px solid var(--marca); border-radius: 12px; background: #fff; transition: width .1s; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; }
  td, th { border-bottom: 1px solid var(--borda); padding: 6px 8px; text-align: left; vertical-align: top; }
  .ok { color: var(--bom); font-weight: 700; }
  .ruim { color: var(--ruim); font-weight: 700; }
  code { font-size: 12px; word-break: break-word; }
</style>
</head>
<body>
<h1>Varredura de responsividade</h1>
<p id="estado">Preparando…</p>
<table><thead><tr><th>Tela</th><th>Largura</th><th>O que achou</th></tr></thead><tbody id="saida"></tbody></table>
<iframe id="quadro" title="tela em teste"></iframe>
<script>
const q = new URLSearchParams(location.search)
// as larguras padrão: celular pequeno → computador grande
const LARGURAS = (q.get('larguras') || '240,320,360,390,414,768,1024,1280,1440').split(',').map(Number)
const LISTAS = ['painel', 'comprar', 'triagem', 'estoque', 'etiquetas', 'vender', 'caixa', 'agenda', 'viagens', 'livro', 'precos', 'pessoas', 'equipe', 'emprestimos', 'adiantamentos', 'relatorios', 'config', 'novidades']
const FORMS = ['viagens/novo', 'pedidos/novo', 'emprestimos/novo', 'adiantamentos/novo', 'venda-rapida']
// fichas: abre a lista e toca na primeira linha (descobre o endereço sozinho)
const FICHAS = ['comprar', 'estoque', 'vender', 'pessoas', 'viagens', 'precos']
const quadro = document.getElementById('quadro')
const espera = (ms) => new Promise((r) => setTimeout(r, ms))
const estado = (t) => (document.getElementById('estado').textContent = t)

function carregar(rota) {
  return new Promise((ok) => {
    quadro.onload = async () => { await espera(2200); ok() }
    quadro.src = `/?varredura=${Date.now()}#/${rota}`
  })
}

/** rola para o lado de propósito (abas, chips, tabela larga): o que está dentro não conta como "saiu da tela" */
function dentroDeRolagem(el, win) {
  for (let p = el.parentElement; p && p !== win.document.body; p = p.parentElement) {
    const s = win.getComputedStyle(p)
    if (/(auto|scroll|hidden|clip)/.test(s.overflowX) && p.getBoundingClientRect().right <= win.document.documentElement.clientWidth + 1) return true
  }
  return false
}
const nome = (el) => {
  const txt = (el.innerText || el.getAttribute('aria-label') || el.getAttribute('placeholder') || '').trim().replace(/\s+/g, ' ').slice(0, 50)
  const cls = (typeof el.className === 'string' ? el.className : '').split(' ').filter(Boolean).slice(0, 4).join('.')
  return `<${el.tagName.toLowerCase()}${cls ? '.' + cls : ''}> ${txt}`
}

function examinar() {
  const win = quadro.contentWindow
  const doc = win.document
  const L = doc.documentElement.clientWidth
  const visivel = (el) => { const r = el.getBoundingClientRect(); const s = win.getComputedStyle(el); return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none' }
  // 1) SAI DA TELA: a peça mais de fora que passa da borda (não as que só estão dentro dela)
  const fora = new Set()
  for (const el of doc.body.querySelectorAll('*')) {
    if (!visivel(el)) continue
    const r = el.getBoundingClientRect()
    if (r.right <= L + 1 && r.left >= -1) continue
    if (win.getComputedStyle(el).position === 'fixed' && r.width <= L + 1) continue
    if (dentroDeRolagem(el, win)) continue
    const p = el.parentElement
    const pr = p?.getBoundingClientRect()
    if (pr && (pr.right > L + 1 || pr.left < -1) && !dentroDeRolagem(p, win)) continue
    fora.add(nome(el))
  }
  // 2) PALAVRA QUEBRADA: a mesma palavra em duas linhas
  const quebradas = new Set()
  const andar = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT)
  const rg = doc.createRange()
  for (let n = andar.nextNode(); n; n = andar.nextNode()) {
    const el = n.parentElement
    if (!el || !visivel(el) || el.closest('script,style,svg,[aria-hidden="true"]')) continue
    const s = win.getComputedStyle(el)
    if (s.whiteSpace === 'nowrap' || s.textOverflow === 'ellipsis') continue
    for (const m of n.textContent.matchAll(/[\p{L}\p{N}]{3,}/gu)) {
      rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length)
      const topos = new Set([...rg.getClientRects()].filter((r) => r.width > 0).map((r) => Math.round(r.top)))
      if (topos.size > 1) quebradas.add(`“${m[0]}” em ${nome(el)}`)
    }
  }
  return { fora: [...fora], quebradas: [...quebradas] }
}

const escapar = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
function mostrar(rota, largura, r) {
  const tr = document.createElement('tr')
  const itens = [...r.fora.map((x) => `🔴 sai da tela: <code>${escapar(x)}</code>`), ...r.quebradas.map((x) => `🟠 palavra quebrada: <code>${escapar(x)}</code>`)]
  tr.innerHTML = `<td>${escapar(rota)}</td><td>${largura}px</td><td>${itens.length ? itens.slice(0, 8).join('<br>') + (itens.length > 8 ? `<br>… e mais ${itens.length - 8}` : '') : '<span class="ok">✓ ok</span>'}</td>`
  if (!itens.length && q.get('so') === 'problemas') return
  document.getElementById('saida').appendChild(tr)
}

async function varrer() {
  const resultado = []
  let rotas = q.get('rotas') ? q.get('rotas').split(',') : [...LISTAS, ...FORMS]
  // descobre as fichas (uma de cada) tocando na primeira linha da lista
  if (!q.get('rotas')) {
    quadro.style.width = '1280px'
    for (const lista of FICHAS) {
      estado(`Descobrindo uma ficha de ${lista}…`)
      await carregar(lista)
      const linha = quadro.contentDocument.querySelector('tbody tr[tabindex], tbody tr')
      const antes = quadro.contentWindow.location.hash
      linha?.click()
      await espera(600)
      const h = quadro.contentWindow.location.hash.replace(/^#\//, '')
      if (h && '#/' + h !== antes) rotas.push(h.split('?')[0])
    }
  }
  rotas = [...new Set(rotas)]
  let k = 0
  for (const rota of rotas) {
    k++
    quadro.style.width = LARGURAS[0] + 'px'
    estado(`Tela ${k} de ${rotas.length}: ${rota}…`)
    await carregar(rota)
    for (const largura of LARGURAS) {
      quadro.style.width = largura + 'px'
      await espera(Number(q.get('espera') || 700))
      const r = examinar()
      resultado.push({ rota, largura, ...r })
      mostrar(rota, largura, r)
    }
  }
  const ruins = resultado.filter((r) => r.fora.length || r.quebradas.length)
  estado(ruins.length ? `Pronto: ${ruins.length} de ${resultado.length} combinações (tela × largura) com problema.` : `Pronto: ${resultado.length} combinações, todas ok ✓`)
  window.__resultado = resultado
  window.__pronto = true
}
varrer()
</script>
</body>
</html>
